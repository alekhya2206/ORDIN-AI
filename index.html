    </div>
    <div className="flex-1 flex items-center justify-center p-6 bg-white dark:bg-dark-2">
      <div className="w-full max-w-md" style={{animation:'fadeUp .5s ease forwards'}}>
        <div className="lg:hidden mb-10 flex justify-center"><Logo onClick={goHome}/></div>
        <div className="flex bg-gray-100 dark:bg-dark-1 rounded-xl p-1 mb-8">{['login','signup'].map(t=><button key={t} onClick={()=>{setTab(t);sE({})}} className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${tab===t?'bg-white dark:bg-dark-3 text-gray-900 dark:text-white shadow-lg':'text-gray-400 dark:text-zinc-500 hover:text-gray-600 dark:hover:text-zinc-300'}`}>{t==='login'?'Log In':'Sign Up'}</button>)}</div>
        <form onSubmit={submit}>
          {tab==='signup'&&<I label="Full Name" name="name" ph="John Doe"/>}
          <I label="Email" name="email" type="email" ph="you@example.com"/>
          <I label="Password" name="pass" type="password" ph="••••••••"/>
          {tab==='signup'&&<I label="Confirm Password" name="confirm" type="password" ph="••••••••"/>}
          {tab==='login'&&<p className="text-right text-xs text-accent mb-5 cursor-pointer hover:underline">Forgot Password?</p>}
          <button type="submit" className="w-full py-3.5 btn-primary rounded-xl font-semibold transition-all duration-300">{tab==='login'?'Log In':'Create Account'}</button>
        </form>
        <div className="flex items-center gap-3 my-6"><div className="flex-1 h-px bg-gray-200 dark:bg-dark-4"/><span className="text-xs text-gray-400 dark:text-zinc-600">OR</span><div className="flex-1 h-px bg-gray-200 dark:bg-dark-4"/></div>
        <div className="flex gap-3 mb-5">
          <button className="flex-1 py-3 glass-light rounded-xl text-sm font-medium text-gray-600 dark:text-zinc-300 hover:bg-black/[.04] dark:hover:bg-white/[.08] transition shadow-sm dark:shadow-none">G  Google</button>
          <button className="flex-1 py-3 glass-light rounded-xl text-sm font-medium text-gray-600 dark:text-zinc-300 hover:bg-black/[.04] dark:hover:bg-white/[.08] transition shadow-sm dark:shadow-none">⌘  GitHub</button>
        </div>
        <button onClick={onGuest} className="w-full py-3 text-sm font-semibold text-gray-400 dark:text-zinc-400 hover:text-accent transition">Continue as Guest →</button>
      </div>
    </div>
  </div>);
}

// ━━━ DASHBOARD ━━━
function Dash({user,onLogout,goHome}){
  const [v,setV]=useState('home');const [side,setSide]=useState(false);const [hist,setHist]=useState(HIST);const [modal,setModal]=useState(null);const [dark,setDark]=useState(false);
  const nav=[{id:'home',i:'⊞',l:'Dashboard'},{id:'new',i:'＋',l:'New Analysis'},{id:'history',i:'◷',l:'History'},{id:'settings',i:'⚙',l:'Settings'}];
  useEffect(()=>{document.documentElement.classList.toggle('dark',dark)},[dark]);
  return(<div className="min-h-screen flex bg-gray-50 dark:bg-dark-1 transition-colors duration-300">
    <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white dark:bg-dark-2 border-r border-gray-200 dark:border-dark-3 flex flex-col transition-transform duration-300 ${side?'translate-x-0':'-translate-x-full lg:translate-x-0'}`}>
      <div className="p-5 flex items-center gap-2"><Logo onClick={goHome}/><button className="lg:hidden ml-auto text-gray-400 dark:text-zinc-500" onClick={()=>setSide(false)}>✕</button></div>
      <nav className="flex-1 p-3 space-y-1">{nav.map(n=><button key={n.id} onClick={()=>{setV(n.id);setSide(false)}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${v===n.id?'bg-accent/10 text-accent':'text-gray-500 dark:text-zinc-500 hover:text-gray-900 dark:hover:text-zinc-300 hover:bg-gray-100 dark:hover:bg-white/[.03]'}`}><span className="text-base">{n.i}</span>{n.l}</button>)}</nav>
      <div className="p-4 border-t border-gray-200 dark:border-dark-3">
        <div className="flex items-center gap-3 mb-3"><div className="w-9 h-9 rounded-full bg-gradient-to-br from-accent to-purple-500 flex items-center justify-center text-sm font-bold text-white">{user[0]}</div><div><p className="text-sm font-semibold">{user}</p><p className="text-xs text-gray-400 dark:text-zinc-600">Patient</p></div></div>
        <button onClick={onLogout} className="w-full py-2.5 text-sm text-gray-400 dark:text-zinc-500 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-xl transition">Logout</button>
      </div>
    </aside>
    {side&&<div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={()=>setSide(false)}/>}
    <main className="flex-1 overflow-y-auto">
      <header className="sticky top-0 z-20 glass px-6 py-3.5 flex items-center justify-between">
        <div className="flex items-center gap-3"><button className="lg:hidden text-gray-500 dark:text-zinc-400 text-lg" onClick={()=>setSide(true)}>☰</button><h2 className="text-lg font-bold">{nav.find(n=>n.id===v)?.l}</h2></div>
        <div className="w-8 h-8 rounded-full bg-gradient-to-br from-accent to-purple-500 flex items-center justify-center text-xs font-bold text-white cursor-pointer">{user[0]}</div>
      </header>
      <div className="p-6 max-w-4xl mx-auto">
        {v==='home'&&<Home user={user} hist={hist} go={()=>setV('new')}/>}
        {v==='new'&&<Anlys hist={hist} setHist={setHist}/>}
        {v==='history'&&<Hist hist={hist} setModal={setModal}/>}
        {v==='settings'&&<Sett user={user} dark={dark} setDark={setDark}/>}
      </div>
    </main>
    {modal&&<Mdl data={modal} onClose={()=>setModal(null)}/>}
  </div>);
}

function Home({user,hist,go}){return(<div style={{animation:'fadeUp .5s ease forwards'}}>
  <div className="relative overflow-hidden rounded-2xl p-8 mb-8 bg-gradient-to-r from-blue-600 to-indigo-700 text-white">
    <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl"/>
    <h2 className="text-3xl font-extrabold mb-2 relative z-10">Welcome back, {user}!</h2>
    <p className="text-blue-100 mb-6 relative z-10">Your health insights are one upload away.</p>
    <button onClick={go} className="px-6 py-3 bg-white text-blue-700 rounded-xl font-semibold hover:bg-blue-50 transition relative z-10">Analyse New Report →</button>
  </div>
  <div className="grid sm:grid-cols-3 gap-4 mb-8">{[['5','Reports Analysed'],['30','Terms Extracted'],['3','Languages Used']].map(([v,l],i)=><div key={i} className="glass-light rounded-2xl p-6 shadow-sm dark:shadow-none"><p className="text-3xl font-extrabold gradient-text">{v}</p><p className="text-sm text-gray-400 dark:text-zinc-500 mt-1">{l}</p></div>)}</div>
  <h3 className="text-xl font-bold mb-4">Recent Analyses</h3>
  <div className="space-y-3">{hist.slice(0,3).map(h=><div key={h.id} className="glass-light rounded-xl p-4 flex items-center justify-between hover:bg-black/[.04] dark:hover:bg-white/[.06] transition shadow-sm dark:shadow-none"><div><p className="font-semibold">{h.type}</p><p className="text-sm text-gray-400 dark:text-zinc-500">{h.date} • {h.lang}</p></div><span className="px-3 py-1 bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 text-xs rounded-full font-semibold border border-emerald-500/30">Completed</span></div>)}</div>
</div>);}

function Anlys({hist,setHist}){
  const [text,setText]=useState('');const [file,setFile]=useState(null);const [lang,setLang]=useState('English');const [phase,setPhase]=useState('input');const [ls,setLs]=useState(-1);const [res,setRes]=useState(null);const [err,setErr]=useState('');const [drag,setDrag]=useState(false);const ref=useRef();
  const pf=f=>{setFile(f);if(f.type==='text/plain'||f.name.endsWith('.txt')){const r=new FileReader();r.onload=e=>setText(e.target.result);r.readAsText(f)}else setText(`[File: ${f.name}]`)};
  const go=async()=>{if(!text.trim()){setErr('Please upload a file or paste text.');return}setErr('');setPhase('loading');setTimeout(()=>setLs(0),400);setTimeout(()=>setLs(1),2000);setTimeout(()=>setLs(2),3500);
    try{if(GROQ_KEY==='gsk_REPLACE_WITH_YOUR_KEY')throw 0;const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${GROQ_KEY}`},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:SYS_PROMPT},{role:'user',content:`Target Language: ${lang}\n\nReport:\n${text}`}],temperature:.3,max_tokens:4000})});if(!r.ok)throw 0;const d=await r.json();const m=d.choices[0].message.content.match(/\{[\s\S]*\}/);if(!m)throw 0;setRes(JSON.parse(m[0]));setPhase('results')}catch{setTimeout(()=>{setRes(MOCK);setPhase('results')},4200)}};
  const save=()=>setHist([{id:Date.now(),date:new Date().toISOString().slice(0,10),type:'Report',lang,result:res},...hist]);
  const reset=()=>{setPhase('input');setText('');setFile(null);setRes(null);setLs(-1)};
  if(phase==='loading')return(<div className="flex flex-col items-center py-24" style={{animation:'fadeUp .5s ease forwards'}}><div className="spinner mb-8"/><h3 className="text-2xl font-extrabold gradient-text mb-8">Analyzing Report...</h3><div className="space-y-5 w-64">{['Extracting medical terms','Simplifying language','Preparing advice'].map((s,i)=><div key={i} className={`flex items-center gap-3 text-sm font-medium transition-all duration-500 ${ls>=i?(ls>i?'text-emerald-500':'text-accent'):'text-gray-300 dark:text-zinc-600'}`}><span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${ls>i?'bg-emerald-500/20':'bg-gray-200 dark:bg-dark-3'}`}>{ls>i?'✓':i+1}</span>{s}</div>)}</div></div>);
  if(phase==='results'&&res)return(<div style={{animation:'fadeUp .5s ease forwards'}}>
    <div className="flex items-center justify-between mb-8"><h3 className="text-2xl font-extrabold">Analysis Complete</h3><div className="flex gap-3"><button onClick={save} className="px-4 py-2.5 bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 rounded-xl text-sm font-semibold hover:bg-emerald-500/25 transition">Save</button><button onClick={reset} className="px-4 py-2.5 glass-light rounded-xl text-sm font-semibold text-gray-600 dark:text-zinc-300 hover:bg-black/[.04] dark:hover:bg-white/[.08] transition shadow-sm dark:shadow-none">New Analysis</button></div></div>
    <h4 className="text-sm font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">Key Metrics</h4>
    <div className="flex flex-wrap gap-2 mb-10">{res.terms.map((t,i)=><span key={i} className={`px-3 py-1.5 rounded-xl text-sm font-semibold inline-flex items-center gap-2 ${sc(t.status)}`}><span className={`w-1.5 h-1.5 rounded-full ${sd(t.status)}`}/>{t.name}: {t.value} {t.unit}</span>)}</div>
    <h4 className="text-sm font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">Plain Language Explanation</h4>
    <div className="glass-light rounded-2xl p-6 mb-6 shadow-sm dark:shadow-none"><ul className="space-y-4">{res.explanation.map((e,i)=><li key={i} className="flex gap-3 text-gray-600 dark:text-zinc-300"><span className="text-accent mt-0.5">●</span><span>{e}</span></li>)}</ul></div>
    {lang!=='English'&&res.translated_explanation&&<><h4 className="text-sm font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">Translated ({lang})</h4><div className="bg-accent/5 border border-accent/20 rounded-2xl p-6 mb-6"><ul className="space-y-4">{res.translated_explanation.map((e,i)=><li key={i} className="flex gap-3 text-gray-600 dark:text-zinc-300"><span className="text-accent mt-0.5">●</span><span>{e}</span></li>)}</ul></div></>}
    <h4 className="text-sm font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">💡 Actionable Advice</h4>
    <div className="glass-light rounded-2xl p-6 shadow-sm dark:shadow-none"><ul className="space-y-4">{(lang!=='English'&&res.translated_advice?res.translated_advice:res.advice).map((a,i)=><li key={i} className="flex gap-3 text-gray-600 dark:text-zinc-300"><span className="text-amber-500 mt-0.5">→</span><span>{a}</span></li>)}</ul></div>
  </div>);
  return(<div style={{animation:'fadeUp .5s ease forwards'}}>
    {err&&<div className="bg-red-500/10 text-red-500 border border-red-500/30 px-4 py-3 rounded-xl mb-5 text-sm font-medium">{err}</div>}
    <div className={`border-2 border-dashed rounded-2xl p-12 text-center cursor-pointer mb-6 transition-all duration-300 ${drag?'border-accent bg-accent/5':'border-gray-300 dark:border-dark-4 hover:border-gray-400 dark:hover:border-zinc-500'}`} onDrop={e=>{e.preventDefault();setDrag(false);if(e.dataTransfer.files[0])pf(e.dataTransfer.files[0])}} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onClick={()=>ref.current?.click()}>
      <div className="w-16 h-16 mx-auto mb-4 rounded-2xl glass-light flex items-center justify-center text-2xl shadow-sm dark:shadow-none">↑</div>
      <p className="font-semibold text-lg">{file?file.name:'Click or drag & drop to upload'}</p>
      <p className="text-sm text-gray-400 dark:text-zinc-500 mt-1">PDF, Image, or Text file</p>
      <input ref={ref} type="file" className="hidden" accept=".pdf,image/*,.txt,.csv" onChange={e=>{if(e.target.files[0])pf(e.target.files[0])}}/>
    </div>
    <label className="block font-semibold mb-2">Or paste report text:</label>
    <textarea value={text} onChange={e=>setText(e.target.value)} rows={5} placeholder="Paste your medical report here..." className="w-full p-4 rounded-xl bg-gray-50 dark:bg-dark-1 border border-gray-300 dark:border-dark-4 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-zinc-600 outline-none focus:border-accent focus:ring-1 focus:ring-accent/30 transition resize-y mb-6"/>
    <label className="block font-semibold mb-3">Language:</label>
    <div className="flex flex-wrap gap-2 mb-8">{LANGS.map(l=><button key={l} onClick={()=>setLang(l)} className={`px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${lang===l?'bg-accent/15 text-accent border border-accent/30':'text-gray-500 dark:text-zinc-500 border border-gray-300 dark:border-dark-4 hover:border-gray-400 dark:hover:border-zinc-500'}`}>{l}</button>)}</div>
    <button onClick={go} className="w-full py-4 btn-primary rounded-2xl font-semibold text-lg transition-all duration-300">✨ Analyse Report</button>
  </div>);
}

function Hist({hist,setModal}){return(<div style={{animation:'fadeUp .5s ease forwards'}}><div className="glass-light rounded-2xl overflow-hidden shadow-sm dark:shadow-none"><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="text-gray-400 dark:text-zinc-500 text-left border-b border-gray-200 dark:border-dark-3"><th className="px-5 py-4 font-semibold">Date</th><th className="px-5 py-4 font-semibold">Type</th><th className="px-5 py-4 font-semibold">Language</th><th className="px-5 py-4 font-semibold">Status</th><th className="px-5 py-4"></th></tr></thead><tbody>{hist.map(h=><tr key={h.id} className="border-t border-gray-100 dark:border-dark-3/50 hover:bg-black/[.02] dark:hover:bg-white/[.03] transition"><td className="px-5 py-4">{h.date}</td><td className="px-5 py-4 text-gray-500 dark:text-zinc-400">{h.type}</td><td className="px-5 py-4 text-gray-500 dark:text-zinc-400">{h.lang}</td><td className="px-5 py-4"><span className="px-2.5 py-1 bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 text-xs rounded-full font-semibold">Done</span></td><td className="px-5 py-4"><button onClick={()=>setModal(h.result)} className="text-accent hover:underline font-medium text-sm">View</button></td></tr>)}</tbody></table></div></div></div>);}

function Sett({user,dark,setDark}){
  const [s,sS]=useState({name:user,email:'user@example.com',lang:'English'});
  return(<div className="max-w-lg" style={{animation:'fadeUp .5s ease forwards'}}>
    <div className="glass-light rounded-2xl p-6 mb-6 shadow-sm dark:shadow-none"><h3 className="text-lg font-bold mb-5">Profile</h3>
      <label className="block text-sm text-gray-500 dark:text-zinc-500 mb-1">Name</label><input value={s.name} onChange={e=>sS({...s,name:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-dark-1 border border-gray-300 dark:border-dark-4 text-gray-900 dark:text-white outline-none focus:border-accent mb-4"/>
      <label className="block text-sm text-gray-500 dark:text-zinc-500 mb-1">Email</label><input value={s.email} onChange={e=>sS({...s,email:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-dark-1 border border-gray-300 dark:border-dark-4 text-gray-900 dark:text-white outline-none focus:border-accent"/>
    </div>
    <div className="glass-light rounded-2xl p-6 mb-6 shadow-sm dark:shadow-none"><h3 className="text-lg font-bold mb-5">Preferences</h3>
      <label className="block text-sm text-gray-500 dark:text-zinc-500 mb-1">Default Language</label>
      <select value={s.lang} onChange={e=>sS({...s,lang:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-dark-1 border border-gray-300 dark:border-dark-4 text-gray-900 dark:text-white outline-none mb-5">{LANGS.map(l=><option key={l}>{l}</option>)}</select>
      <div className="flex items-center justify-between"><span className="text-sm font-medium">Dark Mode</span>
        <button onClick={()=>setDark(!dark)} className={`w-12 h-7 rounded-full transition-all ${dark?'bg-accent':'bg-gray-300'} relative`}><span className={`absolute top-0.5 w-6 h-6 bg-white rounded-full shadow transition-all ${dark?'translate-x-5':'translate-x-0.5'}`}/></button>
      </div>
    </div>
    <button className="px-6 py-3 btn-primary rounded-xl font-semibold transition-all duration-300">Save Changes</button>
  </div>);
}

function Mdl({data,onClose}){return(<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={onClose}><div className="bg-white dark:bg-dark-2 border border-gray-200 dark:border-dark-3 rounded-2xl p-6 max-w-lg w-full max-h-[80vh] overflow-y-auto shadow-2xl" style={{animation:'fadeUp .3s ease forwards'}} onClick={e=>e.stopPropagation()}>
  <div className="flex justify-between items-center mb-5"><h3 className="text-xl font-bold">Analysis Result</h3><button onClick={onClose} className="text-gray-400 dark:text-zinc-500 hover:text-gray-900 dark:hover:text-white text-xl">✕</button></div>
  <div className="flex flex-wrap gap-2 mb-5">{data.terms.map((t,i)=><span key={i} className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${sc(t.status)}`}>{t.name}: {t.value}</span>)}</div>
  <h4 className="font-semibold text-sm text-gray-400 dark:text-zinc-500 uppercase mb-2">Explanation</h4>
  <ul className="space-y-2 mb-5">{data.explanation.map((e,i)=><li key={i} className="text-sm text-gray-500 dark:text-zinc-400 flex gap-2"><span className="text-accent">●</span>{e}</li>)}</ul>
  <h4 className="font-semibold text-sm text-gray-400 dark:text-zinc-500 uppercase mb-2">Advice</h4>
  <ul className="space-y-2">{data.advice.map((a,i)=><li key={i} className="text-sm text-gray-500 dark:text-zinc-400 flex gap-2"><span className="text-amber-500">→</span>{a}</li>)}</ul>
</div></div>);}

// ━━━ ROOT ━━━
function App(){
  const [page,setPage]=useState('landing');const [user,setUser]=useState('Guest');
  const goHome=()=>{setPage('landing');setUser('Guest')};
  if(page==='landing')return<Landing onStart={()=>setPage('auth')} onGuest={()=>{setUser('Guest');setPage('dash')}} goHome={goHome}/>;
  if(page==='auth')return<Auth onAuth={n=>{setUser(n||'User');setPage('dash')}} onGuest={()=>{setUser('Guest');setPage('dash')}} goHome={goHome}/>;
  return<Dash user={user} onLogout={()=>{setUser('Guest');setPage('landing')}} goHome={goHome}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
